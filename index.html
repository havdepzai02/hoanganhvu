<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TỔ 2 — BÀI THƠ 'NHÀN' (Nguyễn Bỉnh Khiêm) — Cinematic Web Deck</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main id="viewport-stage">
    
    <!-- 2.5D CAMERA WORLD: Không gian các lớp đa chiều -->
    <div id="world">
      <!-- 0.65: Hậu cảnh núi non thủy mặc -->
      <img id="layer-BG_Mountain" class="cam-layer" src="assets/bg_mountain.jpg" alt="Dãy núi thủy mặc">

      <!-- 0.75: Làn sương mù thiên nhiên trôi bồng bềnh -->
      <img id="layer-BG_Mist" class="cam-layer mist-floating-anim" src="assets/bg_mist.png" alt="Sương mù Bạch Vân">

      <!-- 1.00: Các chủ thể chính (Hero Layers) -->
      <img id="layer-Hero_Pavilion" class="cam-layer" src="assets/hero_bach_van_am.png" alt="Am Bạch Vân & Cội Tùng">
      <img id="layer-Hero_Hermit" class="cam-layer" src="assets/hero_hermit.png" alt="Nguyễn Bỉnh Khiêm cầm cần câu">
      <img id="layer-Hero_Tools" class="cam-layer" src="assets/hero_tools.png" alt="Mai, Cuốc, Cần câu">
      <img id="layer-Hero_Contrast" class="cam-layer" src="assets/hero_contrast.png" alt="Nơi vắng vẻ vs Chốn lao xao">
      <img id="layer-Hero_Seasons" class="cam-layer" src="assets/hero_four_seasons.png" alt="Măng trúc, Giá đỗ, Hoa sen">
      <img id="layer-Hero_HoeTree" class="cam-layer" src="assets/hero_hoe_dream.png" alt="Cội cây hòe & Giấc mộng hoàng kim">
      <img id="layer-Hero_Nom" class="cam-layer" src="assets/hero_nom_script.png" alt="Thư tịch chữ Nôm đại tự Nhàn">

      <!-- 1.30: Tiền cảnh bụi trúc & ghềnh đá -->
      <img id="layer-FG_Bamboo" class="cam-layer" src="assets/fg_bamboo.png" alt="Bụi trúc tiền cảnh">

      <!-- 1.40: Cánh hoa & lá trúc rơi lơ lửng -->
      <img id="layer-FG_Leaves" class="cam-layer leaves-falling-anim" src="assets/fg_leaves.png" alt="Lá bay thanh tịnh">
    </div>

    <!-- 0.00: Khung Vignette tranh cuộn cổ -->
    <img id="layer-FG_Vignette" class="vignette-overlay" src="assets/fg_vignette.png" alt="Vignette">

    <!-- Scrim chuyển tối -->
    <div id="scrim-overlay" class="scrim-gradient"></div>

    <!-- SVG Callouts nối từ điểm neo của đối tượng -->
    <svg id="callout-svg-layer" viewBox="0 0 13.333 7.5">
      <g id="callout-group-1">
        <path id="callout-line-1" class="c-line" />
        <circle id="callout-dot-1" class="c-dot" r="0.06" />
      </g>
      <g id="callout-group-2">
        <path id="callout-line-2" class="c-line" />
        <circle id="callout-dot-2" class="c-dot" r="0.06" />
      </g>
    </svg>

    <!-- Khung nhãn Callout Text -->
    <div id="callout-chip-1" class="callout-chip"><span id="callout-text-1" class="callout-text"></span></div>
    <div id="callout-chip-2" class="callout-chip"><span id="callout-text-2" class="callout-text"></span></div>

    <!-- HUD Typography mở đầu, kết thúc & Slide Mục lớn -->
    <section id="hud-cinema-panel" class="hud-cinema-container">
      <div id="cinema-team" class="cinema-team">TỔ 2</div>
      <div id="cinema-accent" class="cinema-accent"></div>
      <h1 id="cinema-title" class="cinema-title">NHÀN</h1>
      <h2 id="cinema-thesis" class="cinema-thesis">Nguyễn Bỉnh Khiêm</h2>
      <p id="cinema-body" class="cinema-body">Bức chân dung tinh thần & Tuyên ngôn sống</p>
    </section>

    <!-- HUD Panel kính mờ các Slide phân tích chi tiết -->
    <section id="hud-glass-panel" class="hud-glass-card">
      <h1 id="hud-title" class="hud-title">TIÊU ĐỀ PHÂN TÍCH</h1>
      <div id="hud-accent" class="hud-accent-bar"></div>
      <h2 id="hud-thesis" class="hud-thesis">Câu thơ / Luận điểm trọng tâm</h2>
      <p id="hud-body" class="hud-body">Nội dung diễn giải chi tiết...</p>
    </section>

    <div class="hud-footer-caption">Minh họa nghệ thuật Thủy Mặc — Thiền Định</div>
    <div class="hud-footer-team">TỔ 2 — BÀI THƠ NHÀN</div>

    <!-- 15 Thanh tiến trình bền vững -->
    <div id="progress-bars-row" class="progress-bars-row"></div>

    <!-- Bảng Speaker Notes -->
    <button id="btn-toggle-notes" class="btn-notes" title="Phím tắt N">📝 Speaker Notes</button>
    <aside id="speaker-notes-panel" class="notes-panel">
      <div class="notes-header">
        <strong>GHI CHÚ DIỄN GIẢ (SPEAKER NOTES)</strong>
        <span id="close-notes">&times;</span>
      </div>
      <div id="notes-content" class="notes-body"></div>
    </aside>

    <!-- Thanh điều khiển -->
    <footer class="player-controls">
      <button class="nav-btn" id="btn-prev" title="Lùi lại (←)">❮</button>
      <button class="nav-btn play-btn" id="btn-play-pause" title="Tạm dừng / Tiếp tục (Space)">❚❚ Tạm dừng</button>
      <button class="nav-btn" id="btn-next" title="Kế tiếp (→)">❯</button>
      <div class="progress-bar-container">
        <div id="timeline-progress" class="progress-bar-inner"></div>
      </div>
      <span class="status-counter" id="scene-index">01 / 15</span>
      <button class="nav-btn" id="btn-fullscreen" title="Toàn màn hình (F)">⛶</button>
    </footer>

  </main>

  <script src="app.js"></script>
</body>
</html>
